<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alle Rezepte – Bei uns schmeckt's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <button class="menu-button" id="menuButton" aria-label="Hauptmenü öffnen" aria-expanded="false"><span></span><span></span><span></span></button>
            <a class="topbar-title" href="index.html">Bei uns schmeckt's</a>
            <button class="suche-button" id="sucheButton" aria-label="Suche öffnen" aria-expanded="false">⌕</button>
        </div>
        <div class="suche-panel" id="suchePanel">
            <input type="text" id="sucheInput" placeholder="Rezept suchen ..." autocomplete="off">
            <div id="sucheErgebnisse"></div>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="seitenmenue" id="seitenmenue" aria-hidden="true">
        <div class="seitenmenue-kopf">
            <span>Bei uns schmeckt's</span>
            <button class="menu-schliessen" id="menuSchliessen" aria-label="Hauptmenü schließen">×</button>
        </div>
        <nav class="seitenmenue-inhalt"></nav>
    </aside>

    <main class="alle-rezepte-seite">
        <section class="alle-rezepte-kopf">
            <a class="zurueck" href="index.html">← Zurück</a>
            <p class="alle-rezepte-eyebrow">Die ganze Sammlung</p>
            <h1>Alle Rezepte</h1>
            <p>Lieblingsgerichte, Familienrezepte und kleine Besonderheiten an einem Ort.</p>
        </section>

        <section class="alle-rezepte-werkzeuge" aria-label="Rezepte filtern und sortieren">
            <label class="alle-rezepte-suche">
                <span aria-hidden="true">⌕</span>
                <input id="alleRezepteSuche" type="search" placeholder="Wonach suchst du?" autocomplete="off">
            </label>

            <div class="alle-rezepte-filter" aria-label="Rezeptkategorien">
                <button type="button" class="aktiv" data-rezept-filter="alle">Alle</button>
                <button type="button" data-rezept-filter="klassiker">Klassiker</button>
                <button type="button" data-rezept-filter="pasta">Pasta</button>
                <button type="button" data-rezept-filter="pizza">Pizza</button>
                <button type="button" data-rezept-filter="grill">Grill &amp; BBQ</button>
                <button type="button" data-rezept-filter="suppen">Suppen</button>
                <button type="button" data-rezept-filter="beilagen">Beilagen</button>
                <button type="button" data-rezept-filter="sossen">Soßen &amp; Extras</button>
                <button type="button" data-rezept-filter="suesses">Süßes</button>
            </div>

            <div class="alle-rezepte-zeile">
                <span id="alleRezepteZaehler" aria-live="polite"></span>
                <div class="alle-rezepte-aktionen">
                    <button type="button" id="alleRezepteZufall" class="alle-rezepte-zufall">✦ Überrasch mich</button>
                    <label>
                        <span class="nur-screenreader">Sortierung</span>
                        <select id="alleRezepteSortierung">
                            <option value="thema">Thematisch</option>
                            <option value="az">A–Z</option>
                            <option value="neu">Neu hinzugefügt</option>
                        </select>
                    </label>
                </div>
            </div>
        </section>

        <section class="alle-rezepte-grid" id="alleRezepteGrid" aria-label="Alle Rezepte"></section>
        <p class="alle-rezepte-leer" id="alleRezepteLeer" hidden>Hierzu haben wir noch kein Rezept gefunden.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
